<!-- GenLayer Consensus Spinner
     Drop this SVG anywhere. Works on light/dark. Scale with width/height or CSS. -->
<svg class="genlayer-spinner" viewBox="0 0 100 100" width="48" height="48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loading">
  <style>
    .genlayer-spinner {
      --cobalt: #110FFF;
      --glow: rgba(17, 15, 255, 0.55);
    }
    .genlayer-spinner .mark {
      fill: var(--cobalt);
    }
    .genlayer-spinner .node {
      fill: var(--cobalt);
      transform-origin: 50px 50px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    .genlayer-spinner .node:nth-child(1) { animation-delay: 0.00s; }
    .genlayer-spinner .node:nth-child(2) { animation-delay: 0.36s; }
    .genlayer-spinner .node:nth-child(3) { animation-delay: 0.72s; }
    .genlayer-spinner .node:nth-child(4) { animation-delay: 1.08s; }
    .genlayer-spinner .node:nth-child(5) { animation-delay: 1.44s; }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.85);
        filter: drop-shadow(0 0 0 transparent);
      }
      40%, 60% {
        opacity: 1;
        transform: scale(1.15);
        filter: drop-shadow(0 0 4px var(--glow));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .genlayer-spinner .node {
        animation: none;
        opacity: 0.7;
        transform: scale(1);
      }
    }
  </style>

  <!-- Official GenLayer mark (static, centered & scaled) -->
  <g class="mark" transform="translate(50,50) scale(0.32) translate(-48.88,-45.965)">
    <polygon points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35"/>
    <polygon points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35"/>
    <polygon points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92 48.64 43.78"/>
  </g>

  <!-- 5 validator nodes (triangles) -->
  <g class="nodes">
    <!-- Node positions at radius 38 -->
    <polygon class="node" points="50,12 53.5,18 46.5,18" transform="rotate(0 50 50)"/>
    <polygon class="node" points="50,12 53.5,18 46.5,18" transform="rotate(72 50 50)"/>
    <polygon class="node" points="50,12 53.5,18 46.5,18" transform="rotate(144 50 50)"/>
    <polygon class="node" points="50,12 53.5,18 46.5,18" transform="rotate(216 50 50)"/>
    <polygon class="node" points="50,12 53.5,18 46.5,18" transform="rotate(288 50 50)"/>
  </g>
</svg>
